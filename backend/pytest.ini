[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    integration: marks tests as integration tests requiring external API credentials
    live: marks tests as requiring live running services and live LLM APIs
    ollama_live: marks tests as requiring a running Ollama daemon and pulled local model
